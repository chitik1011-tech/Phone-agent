name: Android 15 device checks
on:
  push:
    branches: [codex/android-device-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android15:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: bash .github/install-android-sdk.sh
      - name: Build app and Android tests
        run: ./gradlew --no-daemon --dependency-verification strict :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot Android 15 and run the instrumented tests
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;default;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/phone-agent-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$tools/avdmanager" create avd --force --name phone_agent_ci \
            --package 'system-images;android-35;default;x86_64' --device pixel_5
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd phone_agent_ci -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/phone-agent-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 150 "$adb" wait-for-device
          deadline=$((SECONDS + 240))
          until [[ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; do
            if (( SECONDS >= deadline )) || ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -50 /tmp/phone-agent-emulator.log
              exit 1
            fi
            sleep 5
          done
          "$adb" shell input keyevent 82
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell settings put global transition_animation_scale 0
          "$adb" shell settings put global animator_duration_scale 0
          "$adb" install app/build/outputs/apk/debug/app-debug.apk
          "$adb" install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$adb" shell am start -W -n dev.phoneagent/.MainActivity | tee /tmp/phone-agent-launch.log
          grep -q 'Status: ok' /tmp/phone-agent-launch.log
          "$adb" shell am instrument -w -r dev.phoneagent.test/androidx.test.runner.AndroidJUnitRunner |
            tee /tmp/phone-agent-instrumentation.log
          grep -Eq '^OK \([1-9][0-9]* tests?\)' /tmp/phone-agent-instrumentation.log
      - name: Save device check output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Phone-Agent-Android-15-logs
          path: /tmp/phone-agent-*.log
          if-no-files-found: ignore

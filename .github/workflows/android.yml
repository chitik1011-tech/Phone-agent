name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: bash .github/install-android-sdk.sh
      - name: Verify projects and assemble APKs
        run: |
          ./gradlew --no-daemon --dependency-verification strict :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          python3 -m unittest discover -s tools/termux
          python3 -m unittest discover -s tools/workspace
          bash .github/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Phone-Agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  preview:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Phone-Agent-debug
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components for release signing
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          HAS_RELEASE_KEY: ${{ secrets.PHONE_AGENT_KEYSTORE_BASE64 != '' }}
        run: bash .github/install-android-sdk.sh
      - name: Publish the verified preview if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          PHONE_AGENT_KEYSTORE_BASE64: ${{ secrets.PHONE_AGENT_KEYSTORE_BASE64 }}
          PHONE_AGENT_STORE_PASSWORD: ${{ secrets.PHONE_AGENT_STORE_PASSWORD }}
          PHONE_AGENT_KEY_ALIAS: ${{ secrets.PHONE_AGENT_KEY_ALIAS }}
          PHONE_AGENT_KEY_PASSWORD: ${{ secrets.PHONE_AGENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="$(cat release/tag.txt)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          if [ -n "$PHONE_AGENT_KEYSTORE_BASE64" ]; then
            umask 077
            export PHONE_AGENT_KEYSTORE="$RUNNER_TEMP/phone-agent-signing.jks"
            trap 'rm -f "$PHONE_AGENT_KEYSTORE"' EXIT
            printf '%s' "$PHONE_AGENT_KEYSTORE_BASE64" | base64 --decode > "$PHONE_AGENT_KEYSTORE"
            unset PHONE_AGENT_KEYSTORE_BASE64
            ./gradlew --no-daemon --dependency-verification strict :app:assembleRelease
            bash .github/verify-apk.sh app/build/outputs/apk/release/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk Phone-Agent-release.apk
            apk=Phone-Agent-release.apk
          else
            mv app-debug.apk Phone-Agent-debug.apk
            apk=Phone-Agent-debug.apk
          fi
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
            --prerelease --title "Phone Agent $tag" --notes-file release/notes.md
